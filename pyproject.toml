[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfai"
version = "0.1.0"
description = "Werewolf player"
readme = "README.rst"
authors = [
  {name = "Raul Cajias", email = "raul@cajias.io"}
]
maintainers = [
  {name = "Raul Cajias", email = "raul@cajias.io"}
]
classifiers = [

]
license = {text = "Not open source"}
dependencies = [
  "typer",
  "langgraph",
  "langchain-core",
  "langchain",
  "langchain-openai",
  "pyswip",
  "fastapi",
  "python-dotenv",
  "docstring-parser",
  "mcp"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "pytest-asyncio",  # async testing
    "ruff"  # linting
]

[project.urls]
bugs = "https://github.com/cajias/wolfai/issues"
changelog = "https://github.com/cajias/wolfai/blob/master/changelog.md"
homepage = "https://github.com/cajias/wolfai"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

# Pytest
# ------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Configure test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Configure test running
addopts = [
    "--verbose",  # Verbose output
    "--tb=short",  # Shorter traceback format
    "--strict-markers",  # Strict handling of markers
    "-ra",  # Show extra test summary info for all except passed tests
]

# Define custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "gamelib: marks gamelib related tests",
    "asyncio: marks tests that require asyncio",
]

[tool.ruff]

[tool.ruff.lint]
# Enable additional lint rules to flag complexity, long functions, and duplication.
select = ["E", "F", "B", "C90", "PLR", "SIM"]

# Never enforce `E501` (line length violations).
ignore = ["E501"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.mccabe]
# Flag overly complex code (McCabe complexity > 10).
max-complexity = 10

[tool.ruff.lint.pylint]
# Warn on excessively long or complex functions.
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# Ignore `E402` (import violations) in all `__init__.py` files and
# relax magic-number checks in tests.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**" = ["PLR2004"]
