[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfai"
version = "0.1.0"
description = "Werewolf player"
readme = "README.md"
authors = [
  {name = "Raul Cajias", email = "raul@cajias.io"}
]
maintainers = [
  {name = "Raul Cajias", email = "raul@cajias.io"}
]
classifiers = [

]
license = {text = "Not open source"}
dependencies = [
  "typer",
  "langgraph",
  "langchain-core",
  "langchain",
  "langchain-openai",
  "pyswip",
  "fastapi",
  "python-dotenv",
  "docstring-parser",
  "mcp"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "pytest-asyncio",  # async testing
    "pytest-bdd",  # BDD/Cucumber testing
    "pytest-cov",  # coverage reporting
    "ruff",  # linting
    "pylint",  # duplicate code detection
    "black",  # code formatting
    "agentic-guardrails @ git+https://github.com/cajias/lint-configs.git@v1.0.0#subdirectory=python",  # lint configs
]

[project.urls]
bugs = "https://github.com/cajias/wolfai/issues"
changelog = "https://github.com/cajias/wolfai/blob/master/changelog.md"
homepage = "https://github.com/cajias/wolfai"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

# Lint Configurations
# -------------------
# Using strict configurations from agentic-guardrails package
# Source: https://github.com/cajias/lint-configs v1.0.0
# Installed via: pip install "agentic-guardrails @ git+https://github.com/cajias/lint-configs.git@v1.0.0#subdirectory=python"

# Pytest
# ------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Configure test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Configure test running
addopts = [
    "--verbose",  # Verbose output
    "--tb=short",  # Shorter traceback format
    "--strict-markers",  # Strict handling of markers
    "-ra",  # Show extra test summary info for all except passed tests
]

# Define custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "gamelib: marks gamelib related tests",
    "asyncio: marks tests that require asyncio",
    "e2e: marks end-to-end tests",
    "bdd: marks BDD/Cucumber tests",
]

# Ruff - Based on agentic-guardrails package config
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable comprehensive linting for code quality, duplication, and dead code detection
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes (includes unused imports F401, unused variables F841)
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "W",     # pycodestyle warnings
    "C90",   # McCabe complexity
    "PLR",   # Pylint refactoring (duplicate code, too many args, etc.)
    "SIM",   # flake8-simplify (detect overly complex code)
]

# Only ignore rules that conflict with Black or are false positives
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E501",  # Line too long (handled by formatter)
]

# Configure per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**/*.py" = [
    "PLR2004", # Allow magic values in tests
    "PLR0913", # Allow many arguments in test functions
]

# Configure complexity thresholds
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# Black - Based on canonical config
[tool.black]
line-length = 100
target-version = ["py311", "py312"]

# MyPy - Extend from canonical config
[tool.mypy]
python_version = "3.11"
files = "."

# Import base strict settings from pyproject-linters.toml
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
warn_no_return = true
strict_equality = true

# Project-specific overrides
[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

# Pylint - Extend from canonical config
[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-attributes = 7
min-public-methods = 1
max-public-methods = 20

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring (handled by ruff)
    "C0115",  # missing-class-docstring (handled by ruff)
    "C0116",  # missing-function-docstring (handled by ruff)
]

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

# Coverage - Extend from canonical config
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
