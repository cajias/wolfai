[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfai"
version = "0.1.0"
description = "Werewolf player"
readme = "README.md"
authors = [
  {name = "Raul Cajias", email = "raul@cajias.io"}
]
maintainers = [
  {name = "Raul Cajias", email = "raul@cajias.io"}
]
classifiers = [

]
license = {text = "Not open source"}
dependencies = [
  "typer",
  "langgraph",
  "langchain-core",
  "langchain",
  "langchain-openai",
  "pyswip",
  "fastapi",
  "python-dotenv",
  "docstring-parser",
  "mcp"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "pytest-asyncio",  # async testing
    "pytest-bdd",  # BDD/Cucumber testing
    "pytest-cov",  # coverage reporting
    "ruff",  # linting
    "pylint",  # duplicate code detection
    "black",  # code formatting
    "agentic-guardrails @ git+https://github.com/cajias/lint-configs.git@v1.0.0#subdirectory=python",  # lint configs
]

[project.urls]
bugs = "https://github.com/cajias/wolfai/issues"
changelog = "https://github.com/cajias/wolfai/blob/master/changelog.md"
homepage = "https://github.com/cajias/wolfai"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

# Lint Configurations
# -------------------
# Using strict configurations from agentic-guardrails v1.0.0
# Source: https://github.com/cajias/lint-configs/releases/tag/v1.0.0
#
# Note: pyproject-linters.toml is downloaded locally because Ruff's 'extend'
# directive requires a file path, not a package reference. The agentic-guardrails
# package is kept as a dependency for documentation and potential tooling.
#
# To update: Download new version from the release and update package version

# Pytest
# ------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Configure test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Configure test running
addopts = [
    "--verbose",  # Verbose output
    "--tb=short",  # Shorter traceback format
    "--strict-markers",  # Strict handling of markers
    "-ra",  # Show extra test summary info for all except passed tests
]

# Define custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "gamelib: marks gamelib related tests",
    "asyncio: marks tests that require asyncio",
    "e2e: marks end-to-end tests",
    "bdd: marks BDD/Cucumber tests",
]

# Ruff - Extend from agentic-guardrails config
[tool.ruff]
extend = "ruff.toml"  # Extracted from agentic-guardrails v1.0.0
target-version = "py311"  # Override for this project

# Project-specific rule adjustments
[tool.ruff.lint]
extend-ignore = [
    "D100",     # Missing docstring in public module (too strict for existing code)
    "D103",     # Missing docstring in public function (too strict for existing code)
    "D104",     # Missing docstring in public package (too strict for existing code)
    "PLC0415",  # Import outside top-level (intentional for lazy loading in __init__.py)
    "G004",     # Logging f-string (acceptable for readability)
    "ERA001",   # Commented-out code (includes intentional TODOs and documentation)
]

# Project-specific per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "PLC0415"]  # Allow late imports and imports outside top-level in __init__ files
"tests/**" = ["ARG001"]  # Allow unused arguments in test fixtures

# MyPy - Project-specific overrides only
# Base strict settings come from agentic-guardrails package
[tool.mypy]
python_version = "3.11"
files = "."

# Project-specific overrides
[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"
