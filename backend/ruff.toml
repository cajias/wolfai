# Canonical Ruff Configuration from agentic-guardrails v1.0.0
# Source: https://github.com/cajias/lint-configs/releases/tag/v1.0.0
# This is extracted from pyproject-linters.toml for use with Ruff's extend directive

line-length = 120
target-version = "py39"

[lint]
# Enable comprehensive linting for code quality, duplication, and dead code detection
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes (includes unused imports F401, unused variables F841)
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "W",     # pycodestyle warnings
    "C90",   # McCabe complexity
    "SIM",   # flake8-simplify (detect overly complex code)
    "PIE",   # flake8-pie (miscellaneous lints, includes unused variables)
    "PLR",   # Pylint refactoring (duplicate code, too many args, etc.)
    "RET",   # flake8-return (return statement issues)
    "ANN",   # flake8-annotations (require type hints)
    "UP",    # pyupgrade (use modern Python syntax)
    "D",     # pydocstyle (docstring conventions)
    "N",     # pep8-naming
    "S",     # flake8-bandit (security issues)
    "BLE",   # flake8-blind-except
    "A",     # flake8-builtins (avoid shadowing builtins)
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (timezone-aware datetime)
    "T10",   # flake8-debugger (no debugger statements)
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking (detect unused imports in type checking blocks)
    "ARG",   # flake8-unused-arguments (detect unused function arguments)
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (detect commented-out code - DEAD CODE DETECTION)
    "PGH",   # pygrep-hooks
    "PL",    # Pylint (all rules, includes unreachable code W0101, pointless statements W0104)
    "TRY",   # tryceratops (exception handling)
    "FLY",   # flynt (f-string conversion)
    "PERF",  # Perflint (performance anti-patterns)
    "RUF",   # Ruff-specific rules (includes RUF100 - unused noqa comments)
]

# Only ignore rules that conflict with Black or are false positives
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E501",  # Line too long (handled by Black)
]

# Project-specific ignores (too strict for existing codebase migrating to strict linting)
extend-ignore = [
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
    "D104",     # Missing docstring in public package
    "D205",     # Missing blank line after summary
    "PLC0415",  # Import outside top-level (intentional for lazy loading)
    "G004",     # Logging f-string (acceptable for readability)
    "G201",     # Logging .exception vs .error (both are valid)
    "ERA001",   # Commented-out code (includes intentional TODOs)
    "ARG001",   # Unused function argument (can be part of interface/protocol)
    "ARG002",   # Unused method argument (can be part of interface/protocol)
    "BLE001",   # Blind except (intentional for resilience in some cases)
    "ANN401",   # Any type (appropriate in generic code)
    "ANN002",   # Missing type for *args in test functions
    "ANN003",   # Missing type for **kwargs in test functions
    "PLW2901",  # Redefined loop name (would require refactoring)
    "PERF203",  # try-except in loop (acceptable trade-off for robustness)
    "PERF401",  # Manual list comprehension (readability over micro-optimization)
    "PTH123",   # builtin open (pathlib not always better)
    "PT011",    # pytest.raises too broad (acceptable in tests)
    "RUF059",   # Unused unpacked variable (intentional in some cases)
    "S104",     # Hardcoded bind all interfaces (acceptable for dev server)
    "S110",     # try-except-pass (intentional error suppression in tests)
    "S112",     # try-except-continue (intentional error handling pattern)
    "S603",     # subprocess without shell (false positive, we don't use shell=True)
    "TRY004",   # Prefer TypeError (ValueError is also valid)
    "TRY300",   # try-consider-else (style preference)
    "TRY301",   # raise-within-try (acceptable pattern)
    "TRY401",   # Verbose log message (acceptable logging pattern)
]

# Configure per-file ignores for test files
[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert statements in tests
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation
    "PLR2004", # Allow magic values in tests
    "PLR0913", # Allow many arguments in test functions
]
"**/test_*.py" = [
    "S101",    # Allow assert statements in tests
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation
    "PLR2004", # Allow magic values in tests
    "PLR0913", # Allow many arguments in test functions
]

# Configure complexity thresholds
[lint.mccabe]
max-complexity = 10  # Flag functions with complexity > 10

[lint.pylint]
max-args = 5  # Maximum number of arguments for a function
max-branches = 12  # Maximum number of branches in a function
max-returns = 6  # Maximum number of return statements
max-statements = 50  # Maximum number of statements in a function

# Pydocstyle configuration
[lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

# isort configuration
[lint.isort]
known-first-party = []  # Add your package names here
force-single-line = false
lines-after-imports = 2
