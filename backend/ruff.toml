# Canonical Ruff Configuration from agentic-guardrails v1.0.0
# Source: https://github.com/cajias/lint-configs/releases/tag/v1.0.0
# This is extracted from pyproject-linters.toml for use with Ruff's extend directive

line-length = 120
target-version = "py39"

[lint]
# Enable comprehensive linting for code quality, duplication, and dead code detection
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes (includes unused imports F401, unused variables F841)
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "W",     # pycodestyle warnings
    "C90",   # McCabe complexity
    "SIM",   # flake8-simplify (detect overly complex code)
    "PIE",   # flake8-pie (miscellaneous lints, includes unused variables)
    "PLR",   # Pylint refactoring (duplicate code, too many args, etc.)
    "RET",   # flake8-return (return statement issues)
    "ANN",   # flake8-annotations (require type hints)
    "UP",    # pyupgrade (use modern Python syntax)
    "D",     # pydocstyle (docstring conventions)
    "N",     # pep8-naming
    "S",     # flake8-bandit (security issues)
    "BLE",   # flake8-blind-except
    "A",     # flake8-builtins (avoid shadowing builtins)
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (timezone-aware datetime)
    "T10",   # flake8-debugger (no debugger statements)
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking (detect unused imports in type checking blocks)
    "ARG",   # flake8-unused-arguments (detect unused function arguments)
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (detect commented-out code - DEAD CODE DETECTION)
    "PGH",   # pygrep-hooks
    "PL",    # Pylint (all rules, includes unreachable code W0101, pointless statements W0104)
    "TRY",   # tryceratops (exception handling)
    "FLY",   # flynt (f-string conversion)
    "PERF",  # Perflint (performance anti-patterns)
    "RUF",   # Ruff-specific rules (includes RUF100 - unused noqa comments)
]

# Only ignore rules that conflict with Black or are false positives
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E501",  # Line too long (handled by Black)
]

# Configure per-file ignores for test files and lazy-loading modules
[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert statements in tests
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation
    "PLR2004", # Allow magic values in tests
    "PLR0913", # Allow many arguments in test functions
]
"**/test_*.py" = [
    "S101",    # Allow assert statements in tests
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation
    "PLR2004", # Allow magic values in tests
    "PLR0913", # Allow many arguments in test functions
]
# Lazy loading modules (intentional architectural pattern per CLAUDE.md)
"src/wolfai/agents/__init__.py" = [
    "PLC0415",  # Lazy import to avoid loading deprecated LangChain dependencies
    "ANN401",  # __getattr__ must return Any
]
"src/wolfai/tools/pl/__init__.py" = [
    "PLC0415",  # Lazy import to avoid requiring SWI-Prolog at import time
    "ANN401",  # __getattr__ must return Any
]
# Generic tool infrastructure requires Any for flexibility
"src/wolfai/tools/mcp_utils.py" = [
    "ANN401",  # Generic introspection code requires Any
    "PERF203", # Try-except in loop is intentional for robustness
    "S112",    # Try-except-continue is intentional for skipping invalid tools
    "TRY004",  # ValueError is appropriate for invalid return type
]
"src/wolfai/tools/mcp_server_factory.py" = [
    "ANN401",  # Generic MCP server requires Any
    "S104",    # Bind to 0.0.0.0 is intentional for dev server
]
"src/wolfai/tools/langchain_utils.py" = [
    "ANN401",  # Variadic args/kwargs require Any for generic tools
]
"src/wolfai/agents/utils.py" = [
    "ANN401",  # Agent executor type is Any (external library)
]
"src/wolfai/agents/prolog.py" = [
    "TRY300",  # Style preference - early return pattern is clear
    "TRY301",  # Not abstracting single raise - clear as-is
]
"src/wolfai/api.py" = [
    "PERF203", # Try-except in loop intentional for WebSocket robustness
]
"src/wolfai/tools/pl/prolog.py" = [
    "TRY300",  # Style preference - early return pattern
]
"tests/agents/test_prolog_agent.py" = [
    "S603",    # subprocess call with user-controlled path (test only)
    "PERF203", # Try-except in loop (test logging pattern)
]
"tests/e2e/test_game_features.py" = [
    "PERF203", # Try-except in loop (BDD test pattern)
    "ARG001",  # BDD step functions have unused fixture/context params
]
"tests/tools/test_mcp_utils.py" = [
    "ANN401",  # Test functions need Any for generic tool testing
    "ARG001",  # Test helper functions have unused params for schema generation
]

# Configure complexity thresholds
[lint.mccabe]
max-complexity = 10  # Flag functions with complexity > 10

[lint.pylint]
max-args = 5  # Maximum number of arguments for a function
max-branches = 12  # Maximum number of branches in a function
max-returns = 6  # Maximum number of return statements
max-statements = 50  # Maximum number of statements in a function

# Pydocstyle configuration
[lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

# isort configuration
[lint.isort]
known-first-party = []  # Add your package names here
force-single-line = false
lines-after-imports = 2
